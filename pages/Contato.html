<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <title>Contato - ItaPets</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    

</head>

<body class="bg-light">

    <header class="bg-dark text-white p-4">

        <h1>ItaPets</h1>

        <p>
            O melhor para seu animal de estimação!
        </p>

        <nav>
            <a href="../index.html" class="text-white">
                Home
            </a> |

            <a href="../index.html#Vestimentas" class="text-white">
                Vestimentas
            </a> |

            <a href="../index.html#Acessórios" class="text-white">
                Acessórios
            </a> |

            <a href="../index.html#Objetos_Variados" class="text-white">
                Objetos Variados
            </a> |

            <a href="../index.html#Racao" class="text-white">
                Ração
            </a> |

            <a href="../pages/Contato.html" class="text-white">
                Contato
            </a>


        </nav>

    </header>


    <main class="p-4">

        <section id="contato">

            <h2 id="tituloContato" class="text-center mb-4">
                Fale Conosco
            </h2>


            <form action="mailto:seuemail@exemplo.com?subject=Comentário%20sobre%20o%20site%20ItaPets" method="post" enctype="text/plain">

                <fieldset class="bg-white border rounded p-4 mb-4 shadow">

                    <h3 class="mb-4">
                        Dados
                    </h3>

                    <label for="nome" class="form-label">
                        Nome Completo:
                    </label>

                    <input type="text" id="nome" name="Nome" class="form-control mb-3" required placeholder="Digite seu nome">


                    <label for="email" class="form-label">
                        E-mail:
                    </label>

                    <input type="email" id="email" name="E-mail" class="form-control mb-3" required placeholder="seuemail@exemplo.com">


                    <label for="telefone" class="form-label">
                        Telefone:
                    </label>

                    <input type="tel" id="telefone" name="Telefone" class="form-control" required placeholder="(79) 99999-9999">

                </fieldset>


                <fieldset class="bg-white border rounded p-4 mb-4 shadow">

                    <h3 class="mb-4">
                        Você comprou algum produto?
                    </h3>

                    <input type="radio" id="Sim" name="ComprouProduto" value="Sim" class="form-check-input">

                    <label for="Sim" class="form-check-label">
                        Sim
                    </label>


                    <br>


                    <input type="radio" id="Nao" name="ComprouProduto" value="Não" class="form-check-input">

                    <label for="Nao" class="form-check-label">
                        Não
                    </label>

                </fieldset>


                <fieldset class="bg-white border rounded p-4 mb-4 shadow">

                    <h3 class="mb-4">
                        Descreva o motivo de contato
                    </h3>

                    <textarea id="comentario" name="Comentario" rows="5" cols="40" class="form-control" required placeholder="Escreva aqui..."></textarea>

                </fieldset>


                <button type="submit" class="btn btn-primary">
                    Enviar Comentário
                </button>

                <button type="reset" class="btn btn-secondary">
                    Limpar Campos
                </button>

            </form>

        </section>

    </main>


    <footer class="bg-dark text-white text-center p-4">

        <p class="mb-0">
            &copy; 2026 ItaPets - Todos os Direitos Reservados.
        </p>

    </footer>

</body>

<style>
    body.dark {
    background-color: #1e1e1e !important; 
    color: white !important;
}
</style>

<script src="../js/script.js"></script>

</html>
