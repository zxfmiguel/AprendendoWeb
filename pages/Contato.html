<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
   <header id="Header">
        <div><h1>ItaPets </h1>
        <div>O melhor para seu animal de estimação!</div>
        </div>
        <nav>
            <p><a href="../index.html">Home</a> | 
                <a href="../index.html#Vestimentas">Vestimentas</a> | 
                <a href="../index.html#Acessórios">Acessórios</a> | 
                <a href="../index.html#Objetos Variados">Objetos Variados</a> | 
                <a href="../index.html#Racao">Ração</a> | 
                <a href="../pages/Contato.html">Contato</a>  
            </p>
        </nav>
        
    </header>
    
    <main>
            <section id="contato">
                <h2>Fale Conosco</h2>
                
                <form action="mailto:seuemail@exemplo.com?subject=Comentário%20sobre%20o%20site%20ItaPets" method="post" enctype="text/plain">

                    <fieldset>
                        <h3>Dados</h3>
                        
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" name="Nome" required placeholder="Digite seu nome">

                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="E-mail" required placeholder="seuemail@exemplo.com">

                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="Telefone" required placeholder="(79) 99999-9999">
                    </fieldset>

                    <fieldset>
                        <h3>Você comprou algum produto?</h3>
                        
                        <input type="radio" id="Sim" name="ComprouProduto" value="Sim">
                        <label for="pet-cao">Sim</label>

                        <input type="radio" id="Não" name="ComprouProduto" value="Não">
                        <label for="pet-gato">Não</label>

                    </fieldset>

                    <fieldset>
                        <h3>Descreva o motivo de contato</h3>
                        <textarea id="comentario" name="Comentario" rows="5" cols="40" required placeholder="Escreva aqui..."></textarea>
                    </fieldset>

                    <button type="submit">Enviar Comentário</button>
                    <button type="reset">Limpar Campos</button>

                </form>
            </section>
        </main>

<footer>
        <p>&copy; 2026 ItaPets - Todos os Direitos Reservados.</p>
    </footer>
</body>
</html>
